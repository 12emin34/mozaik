---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: mozaik
description: something idk

base-image: ghcr.io/ublue-os/bazzite
image-version: stable

modules:
  - type: justfiles
    validate: true
    include:
      - 60-mozaik.just

  - type: files
    files:
      - source: system
        destination: /

  - type: os-release
    properties:
      NAME: MOZAIK
      ID: mozaik
      ID_LIKE: fedora
      PRETTY_NAME: "Mozaik 44"
      VARIANT: "Mozaik KDE"
      VARIANT_ID: mozaik
      HOME_URL: "https://github.com/12emin34/mozaik"
      DOCUMENTATION_URL: "https://github.com/12emin34/mozaik/tree/main/docs"
      BUG_REPORT_URL: "https://github.com/12emin34/mozaik/issues"
        

  - type: signing
